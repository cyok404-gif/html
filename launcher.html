<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>런처 튜토리얼 미리보기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage-wrap {
      position: relative;
      width: calc(360px * var(--scale, 1));
      height: calc(760px * var(--scale, 1));
    }
    .phone {
      position: absolute;
      inset: 0 auto auto 0;
      width: 360px;
      height: 760px;
      overflow: hidden;
      transform: scale(var(--scale, 1));
      transform-origin: top left;
      background: #fff;
      box-shadow: 0 16px 48px rgba(20,31,48,.14);
    }
    .slides {
      width: 360px;
      height: 1520px;
      transform: translateY(0);
      transition: transform 680ms cubic-bezier(.22,1,.36,1);
      will-change: transform;
    }
    .slide {
      position: relative;
      width: 360px;
      height: 760px;
      overflow: hidden;
    }
    .screen-img {
      position: absolute;
      inset: 0;
      width: 360px;
      height: 760px;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    .mask {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    .page1-mask {
      left: 122px;
      top: 238px;
      width: 116px;
      height: 100px;
      background: #fff;
    }
    .page2-mask {
      left: 110px;
      top: 216px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #0c4a83;
    }
    .lottie {
      position: absolute;
      z-index: 3;
      overflow: visible;
      cursor: pointer;
    }
    #lottie1 {
      left: 136px;
      top: 238px;
      width: 88px;
      height: 88px;
    }
    #lottie2 {
      left: 80px;
      top: 190px;
      width: 200px;
      height: 200px;
    }
    .lottie svg { overflow: visible !important; }
    .pager {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 6;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(17,24,39,.48);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      user-select: none;
    }
    .nav-btn {
      position: absolute;
      z-index: 7;
      bottom: 10px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(17,24,39,.46);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .nav-up { right: 52px; }
    .nav-down { right: 10px; bottom: 52px; }
    .nav-btn:disabled { opacity: .28; cursor: default; }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(31,41,55,.52);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    @media (max-width: 480px) {
      .hint { display: none; }
      .phone { box-shadow: none; }
    }
  </style>
</head>

    const slides = document.getElementById("slides");
    const pager = document.getElementById("pager");
    const upBtn = document.getElementById("upBtn");
    const downBtn = document.getElementById("downBtn");
    let page = 0;
    let locked = false;

    function renderPage() {
      slides.style.transform = `translateY(${-page * 760}px)`;
      pager.textContent = `${page + 1} / 2`;
      upBtn.disabled = page === 0;
      downBtn.disabled = page === 1;
    }

    function go(delta) {
      if (locked) return;
      const next = Math.max(0, Math.min(1, page + delta));
      if (next === page) return;
      page = next;
      locked = true;
      renderPage();
      setTimeout(() => locked = false, 720);
    }

    upBtn.addEventListener("click", () => go(-1));
    downBtn.addEventListener("click", () => go(1));

    window.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) < 12) return;
      go(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "PageDown") go(1);
      if (e.key === "ArrowUp" || e.key === "PageUp") go(-1);
    });

    let touchY = null;
    window.addEventListener("touchstart", e => {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener("touchend", e => {
      if (touchY == null) return;
      const dy = touchY - e.changedTouches[0].clientY;
      touchY = null;
      if (Math.abs(dy) > 35) go(dy > 0 ? 1 : -1);
    }, { passive: true });

    function fit() {
      const scale = Math.min(
        window.innerWidth / 360,
        window.innerHeight / 760,
        1
      );
      document.documentElement.style.setProperty("--scale", scale);
    }
    window.addEventListener("resize", fit);
    fit();
    renderPage();
