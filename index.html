<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottie 화면 전환 미리보기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    body { display: grid; place-items: center; }
    .stage-wrap {
      position: relative;
      width: calc(360px * var(--scale, 1));
      height: calc(760px * var(--scale, 1));
      overflow: visible;
    }
    .phone {
      position: absolute;
      left: 0;
      top: 0;
      width: 360px;
      height: 760px;
      overflow: hidden;
      background: #fff;
      transform: scale(var(--scale, 1));
      transform-origin: top left;
      box-shadow: 0 16px 48px rgba(20, 31, 48, .14);
      border: 0;
    }
    .slides {
      width: 360px;
      height: 2280px;
      transform: translateY(0);
      transition: transform 680ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }
    .slide {
      position: relative;
      width: 360px;
      height: 760px;
      overflow: hidden;
      background: #fff;
    }
    .screen-img {
      position: absolute;
      inset: 0;
      width: 360px;
      height: 760px;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    .icon-mask {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      background: #fff;
    }
    .bio-mask {
      left: 126px;
      top: 188px;
      width: 108px;
      height: 108px;
      border-radius: 50%;
    }
    .payment-mask {
      left: 139px;
      top: 222px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
    }
    .lottie-box {
      position: absolute;
      z-index: 3;
      cursor: pointer;
    }
    .bio-lottie {
      left: 127px;
      top: 190px;
      width: 106px;
      height: 106px;
    }
    .payment-lottie {
      left: 140px;
      top: 223px;
      width: 80px;
      height: 80px;
    }
    .lottie-box svg { overflow: visible !important; }
    .pager {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 6;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(17, 24, 39, .48);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      letter-spacing: .02em;
      user-select: none;
    }
    .nav-btn {
      position: absolute;
      z-index: 7;
      right: 10px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(17, 24, 39, .46);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }
    .nav-btn:hover { transform: scale(1.06); background: rgba(17, 24, 39, .64); }
    .nav-up { bottom: 52px; }
    .nav-down { bottom: 10px; right: 52px; }
    .nav-btn:disabled { opacity: .28; cursor: default; transform: none; }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(31, 41, 55, .52);
      font-size: 12px;
      letter-spacing: -.02em;
      user-select: none;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      .hint { display: none; }
      .phone { box-shadow: none; }
      .nav-btn, .pager { transform: scale(.92); transform-origin: bottom right; }
      .nav-btn:hover { transform: scale(.96); }
    }
  </style>
</head>

    const slides = document.getElementById('slides');
    const pager = document.getElementById('pager');
    const upBtn = document.getElementById('upBtn');
    const downBtn = document.getElementById('downBtn');
    const total = 3;
    let current = 0;
    let locked = false;
    let touchStartY = null;

    function setScale() {
      const scale = Math.min(window.innerWidth / 360, window.innerHeight / 760, 1.15);
      document.documentElement.style.setProperty('--scale', scale.toString());
    }
    setScale();
    window.addEventListener('resize', setScale);

    function makeLottie(container, data) {
      const anim = lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: false,
        autoplay: false,
        animationData: data,
        rendererSettings: {
          preserveAspectRatio: 'xMidYMid meet',
          progressiveLoad: false,
          hideOnTransparent: true
        }
      });
      anim.addEventListener('DOMLoaded', () => {
        anim.goToAndPlay(0, true);
      });
      container.addEventListener('click', () => {
        anim.stop();
        anim.goToAndPlay(0, true);
      });
      return anim;
    }

    const animations = [
      makeLottie(document.getElementById('completeLottie'), completeData),
      makeLottie(document.getElementById('cautionLottie'), cautionData),
      makeLottie(document.getElementById('paymentCautionLottie'), cautionMediumData)
    ];

    function replayCurrent() {
      const anim = animations[current];
      if (!anim) return;
      anim.stop();
      anim.goToAndPlay(0, true);
    }

    function updateControls() {
      pager.textContent = `${current + 1} / ${total}`;
      upBtn.disabled = current === 0;
      downBtn.disabled = current === total - 1;
    }

    function goTo(index) {
      const next = Math.max(0, Math.min(total - 1, index));
      if (next === current) return;
      current = next;
      slides.style.transform = `translateY(${-760 * current}px)`;
      updateControls();
      window.setTimeout(replayCurrent, 260);
    }

    function step(delta) {
      if (locked) return;
      const next = current + delta;
      if (next < 0 || next >= total) return;
      locked = true;
      goTo(next);
      window.setTimeout(() => { locked = false; }, 760);
    }

    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (Math.abs(event.deltaY) < 12) return;
      step(event.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    window.addEventListener('keydown', (event) => {
      if (['ArrowDown', 'PageDown', 'Space'].includes(event.code)) {
        event.preventDefault();
        step(1);
      }
      if (['ArrowUp', 'PageUp'].includes(event.code)) {
        event.preventDefault();
        step(-1);
      }
      if (event.code === 'Home') goTo(0);
      if (event.code === 'End') goTo(total - 1);
    });

    upBtn.addEventListener('click', () => step(-1));
    downBtn.addEventListener('click', () => step(1));

    window.addEventListener('touchstart', (event) => {
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (event) => {
      if (touchStartY === null) return;
      const diff = touchStartY - event.changedTouches[0].clientY;
      touchStartY = null;
      if (Math.abs(diff) < 40) return;
      step(diff > 0 ? 1 : -1);
    }, { passive: true });

    updateControls();
  </script>
